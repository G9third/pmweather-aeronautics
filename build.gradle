plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public' }
    maven { name = 'RyanHCode'; url = 'https://maven.ryanhcode.dev/releases' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = '1.21'
        mappingsVersion = '2024.11.10'
    }

    runs {
        client { client() }
        server { server() }
    }

    mods {
        pmweather_aeronautics {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly files('libs/pmweather-1.21.1-0.17.14-alpha.jar')
    compileOnly files('libs/sable-neoforge-1.21.1-2.0.5.jar')
    compileOnly files('libs/sable-companion-common-1.21.1-1.6.0.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('verifyExternalApi', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.axes.pmweather_aeronautics.ExternalApiChecks'
}
// ExternalApiChecks is a deliberately dependency-free executable assertion
// program, invoked by verifyExternalApi below. It is not a JUnit/TestNG suite.
// Gradle 9 fails an otherwise successful build when Test sees test classes but
// discovers no framework tests, so keep that redundant runner disabled.
tasks.named('test') { enabled = false }
tasks.named('check') { dependsOn tasks.named('verifyExternalApi') }

processResources {
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_version', mod_version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'neoforge_version', neoforge_version
    inputs.property 'sable_version', sable_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand inputs.properties
    }
}
